/**:
  ros__parameters:
    # Startup choices / software policy / bench tuning, NOT measured vehicle limits.
    # Parameters are read-only after startup; Vehicle Control requests use the owner topic.
    rate_hz: 20.0
    state_timeout_s: 0.5
    command_timeout_s: 0.5
    input_timeout_s: 0.5

    # Sensor Interface 구독토픽 활성화 (공통 key: 내부 소비 노드도 같은 값을 확인)
    # false이면 해당 subscription과 대응 relay publisher를 생성하지 않음.
    gnss_enabled: true
    imu_enabled: false
    rgb_enabled: false
    lidar_enabled: false
    depth_enabled: false
    lane_enabled: false             # 외부 Lane 입력 + lane_observation + lane_pose
    motor_feedback_enabled: false   # true rejected: encoder adapter NOT_IMPLEMENTED
    steering_feedback_enabled: false # true rejected: encoder adapter NOT_IMPLEMENTED

    # Sensor Interface 발행토픽 활성화
    # sensor_*와 lane_observation은 위 구독 활성화와 연동, 별도 중복 스위치 없음.
    # 예를들어 gnss_enabled = true 이면 sensor_gnss_enabled = true 이다.
    vehicle_feedback_enabled: false # true이면 현재는 stamp=0 / invalid heartbeat만 발행

    # Object Manager 구독·발행토픽 활성화 (false = NONE, 센서 구독/출력/timer 없음)
    object_state_enabled: false     # Motion Planning / Mission도 같은 key로 의존성 조절

    # Mission 노드·구간 정책 활성화와 상수는 mission.yaml에서 설정.

    # Path Planning / Global Path Provider 공통 Guidance Mode 설정
    # 시작 시 고정, 변경 후 재시작; 별도 모드 요청 토픽 없음.
    guidance_mode: GPS              # GPS / LANE / HYBRID (LANE/HYBRID NOT_IMPLEMENTED)
    # Global Path Provider 입력·발행 활성화
    # GPS/HYBRID + map_file 비어있지 않을 때만 활성; LANE은 조회/발행/timer 없음.
    # GNSS datum 확인 후 1회 latched 발행. 원점 변경 시 재발행하며
    # 조회 실패/좌표계 불일치 시 기존 경로를 빈 경로로 철회.

/control/sensor_interface:
  ros__parameters:
    # Sensor Interface 입력 검증 설정
    # input_timeout_s: common source-age admission policy. Lane confidence threshold
    # remains a planner policy; ingress only checks finite confidence in [0, 1].
    # External motor/steering encoder inputs are reserved in pipeline.yaml.
    # Adapters/type/unit contracts are TODO: keep encoder enable flags false.
    input_timeout_s: 0.5

/control/global_state_estimator:
  ros__parameters:
    # Global State Estimator 구독: 선택 모드가 요구하는 활성 입력만 구독, 모순이면 시작 오류.
    # Global State Estimator 발행: global_pose / motion_state 항상 발행 (NONE은 invalid).
    # Global Pose Mode 설정
    pose_mode: GNSS                 # GNSS / GNSS_IMU (TODO) / NONE
    # Motion Mode 설정
    motion_mode: GNSS               # GNSS / GNSS_IMU (TODO) / WHEEL (TODO) / NONE
    # Global State Estimator 품질 검증 설정
    max_position_std_m: 1.0           # TUNE: covariance quality policy, not measured
    max_yaw_variance_rad2: 0.25       # TUNE
    # vehicle.wheelbase_m comes from vehicle.yaml, used only by future WHEEL estimator.
    max_speed_variance_m2ps2: 1.0      # TUNE; rejects GNSS unobserved 1e12

/control/lane_state_estimator:
  ros__parameters:
    # Lane State Estimator 구독·발행: 공통 lane_enabled에 연동, false이면 둘 다 생성하지 않음.
    state_timeout_s: 0.5            # Observation source freshness; no filtering/geometry

/control/path_planning:
  ros__parameters:
    # Path Planning 구독: GPS=global_pose+global_path, LANE=lane_pose, HYBRID=세 입력.
    # LANE/HYBRID는 공통 lane_enabled=true 필요. 선택 모드의 입력만 구독.
    # Path Planning 발행: reference_path만 발행. 입력 불량/미구현 모드는 빈 경로.
    # Guidance Mode는 위 공통 guidance_mode 사용; 파일 제공자와 같은 설정 공유.
    lane_min_confidence: 0.5         # Software admission policy, NOT field calibrated
    map_datum_verified: true         # 파일 제공자가 GNSS 실제 datum으로 재투영한 경로 사용.
    # 별도 외부 Path 제공자로 교체하면 그 제공자의 datum 정합성을 확인해야 함.
    lane_correction_enabled: false   # true rejected until correction is implemented

/control/mission_based_limit:
  ros__parameters:
    # Mission Based Limit 구독·발행: mission.yaml의 공통 mission_limit_enabled에 연동.
    # 구간 정책 활성 시 global_pose + mission_map 추가 구독.
    # Mission 상수는 mission.yaml; 현재 다른 노드의 모드/센서 활성화를 변경하지 않음.
    # 구간 판단 설정·기존 ObjectState freshness도 mission.yaml 사용.
    rate_hz: 20.0

/control/motion_planning:
  ros__parameters:
    # Motion Planning 구독: reference_path / motion_state 필수.
    # object_state / mission_limit은 공통 활성화 key가 true일 때만 구독·검증.
    # 비활성 입력은 reason에 명시하며 가짜 valid ObjectState/MissionLimit을 만들지 않음.
    # Motion Planning 발행: motion_plan 항상 발행. Mission 비활성 시 cruise speed 사용.
    # 등속 목표는 mission.yaml의 공통 cruise_speed_kph 사용.
    input_timeout_s: 0.5

/control/motion_control:
  ros__parameters:
    # Motion Control 구독: global_pose / motion_state / motion_plan / status.
    # Motion Control 발행: auto_cmd / tracking_status 항상 발행.
    # Tracking Mode 설정 (시작 시 고정, 변경 후 재시작; 별도 요청 토픽 없음)
    tracking_mode: PID              # PID / PURE_PURSUIT / ADAPTIVE_PURE_PURSUIT (TODO)
    pid:
      enabled: false               # Opt-in after tuning; defaults report PID_NOT_CONFIGURED
      kp_lateral: 0.0              # rad/m; PLACEHOLDER, NOT field tuned
      ki_lateral: 0.0              # rad/(m*s); PLACEHOLDER
      kd_lateral: 0.0              # rad*s/m; PLACEHOLDER
      kp_heading: 0.0              # rad/rad; PLACEHOLDER
      integral_limit_m_s: 0.0      # m*s; anti-windup bound, PLACEHOLDER
      max_steering_rad: 0.0        # Controller software clamp, NOT measured physical limit
      max_dt_s: 0.5               # Software timing policy; excessive dt resets PID
    # PURE_PURSUIT uses the unchanged legacy speed-adaptive implementation below.
    # ADAPTIVE_PURE_PURSUIT (additional error adaptation) is NOT_IMPLEMENTED;
    # no unimplemented gain parameters or silent PURE_PURSUIT fallback.
    lookahead_min_m: 2.0             # TUNE / NOT field validated
    lookahead_max_m: 6.0             # TUNE
    lookahead_gain_s: 1.0            # Ld = clamp(min + gain * speed, min, max)
    goal_tolerance_m: 0.3            # TUNE

/control/control_selector:
  ros__parameters:
    # Control Selector 구독: auto_cmd / manual_cmd / mode_request / vehicle_interface_status.
    # Control Selector 발행: selected_cmd / status 항상 발행.
    # Vehicle Control Mode 설정
    mode: IDLE                      # Initial mode; mode_request changes runtime mode
    
/control/vehicle_interface:
  ros__parameters:
    # Vehicle Interface 구독: selected_cmd / estop 항상 유지 (보호 입력 비활성화 없음).
    # Vehicle Interface 발행: vehicle_interface_status 항상 발행, actuator 송신 미구현.
    # 최종 보호·운용 한계 설정
    dry_run: true                   # false rejected: no UDP backend implemented
    operating_limits_verified: false
    max_steer_rad: 0.0               # TODO NOT_VERIFIED; zero disables driving
    max_speed_mps: 0.0               # TODO NOT_VERIFIED; zero disables driving
    # Out-of-range commands STOP, preserving the existing policy (no saturation).
    # Steering road-wheel calibration, motor raw/mps and brake model are NOT_VERIFIED.
