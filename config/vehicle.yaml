/**:
  ros__parameters:
    # Local source of truth. Rear axle centre, +x forward, +y left, +z up.
    # Mount z_m values are heights above ground, NOT rear-axle-relative TF z.
    vehicle:
      length_m: 2.222                 # MEASURED, user 2026-10
      width_m: 1.280                  # MEASURED
      height_m: 1.3005                # MEASURED
      rear_axle_from_rear_m: 0.225    # MEASURED
      front_axle_from_rear_m: 1.553   # MEASURED
      wheelbase_m: 1.328              # MEASURED: 1.553 - 0.225
      track_width_m: 1.060            # MEASURED
      wheel_diameter_m: 0.47         # TEMPORARY: user 47 cm; replace after measurement
      motor_to_wheel_ratio: 1.0      # USER_CONFIRMED: motor RPM / wheel RPM, direct drive
      # Vehicle command limits; degrees / km/h here, rad / m/s internally.
      limits:
        # GPS 원선회 기반 좌우 공통 등가 조향각. 중간값은 선형으로 가정.
        # 기계 끝단과 별도이며, PC UDP는 float32 degree로 ±17.01까지 전송.
        min_steering_deg: -17.01    # right negative
        max_steering_deg:  17.01    # left positive
        min_speed_kph:    -132.89    # USER_SPECIFIED: reverse negative
        max_speed_kph:     132.89    # USER_SPECIFIED: forward positive
    lidar_mount:
      x_m: 0.559                     # MEASURED: 0.784 - 0.225
      y_m: 0.0                       # ASSUMPTION: centreline, NOT_MEASURED
      z_m: 1.224                     # MEASURED
    camera_mount:
      x_m: 0.636                     # MEASURED: 0.861 - 0.225
      y_m: 0.0                       # ASSUMPTION: centreline, NOT_MEASURED
      z_m: 1.140                     # MEASURED
      pitch_deg: 0.0                 # CONFIG: horizontal 0, up positive
    gnss_mount:
      x_m: 0.559                     # CONFIG: rear axle -> antenna, forward positive
      y_m: 0.0                       # CONFIG: left positive
      z_m: 1.424                     # CONFIG: height above ground
    path_reference:
      offset_x_m: 0.0                # CONFIG: rear axle centre
      offset_y_m: 0.0                # CONFIG: rear axle centre
    # Wheelbase / command limits / wheel diameter / drive ratio are consumed now.
    # Other geometry documents future footprint/TF.
    # TODO NOT_MEASURED: rear axle ground height, GNSS rotation, IMU xyz/RPY,
    # camera roll/yaw and optical-frame transform, and LiDAR rotation extrinsics.
    # NO TF is published from these partial measurements.
