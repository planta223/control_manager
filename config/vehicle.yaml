/**:
  ros__parameters:
    # =============
    # 차량 수치
    # =============
    vehicle:
      length_m: 2.222                 # 실측
      width_m: 1.280                  # 실측
      height_m: 1.3005                # 실측
      rear_axle_from_rear_m: 0.225    # 실측, 차량 후단에서 후륜축까지 거리
      front_axle_from_rear_m: 1.553   # 실측, 차량 후단에서 전륜축까지 거리
      wheelbase_m: 1.328              # 실측: 1.553 - 0.225
      track_width_m: 1.060            # 실측, 좌우 바퀴 중심 간 거리
      wheel_diameter_m: 0.47          # 실측
      
      # =============
      # 제어 상한
      # =============
      limits:
        min_steering_deg: -17.01           # 우회전 음수
        max_steering_deg:  17.01           # 좌회전 양수
        min_speed_kph: -78.97057078989354  # 후진 음수
        max_speed_kph:  78.97057078989354  # 전진 양수
        max_lateral_accel_g: 0.20          # 횡가속도 운용 상한, 실측 한계 아님. 1g = 9.80665m/s².
        max_accel_kphps: 5.0             # 종가속도 모든 AUTO 속도 증가 구간의 명령 증가율, 실측 성능 아님.
        max_decel_kphps: 0.0               # 미정. 0이면 일반 감속 명령은 즉시 적용. 변속 사용 시 양수 지정 필수.
        # 감속도는 속도 계획에도 사용. 정지·제동·무효 입력은 가감속 제한을 우회해 즉시 적용.
    
    # =============
    # 센서 좌표계
    # +x 전방, +y 좌측, +z 상방. (z_m은 지면으로부터의 높이이며 후륜축 기준 좌표 변환의 z값이 아님)
    # =============
    lidar_mount:
      x_m: 0.559                     # 실측: 0.784 - 0.225
      y_m: 0.0                       # 중심선에 있다고 가정, 미실측
      z_m: 1.224                     # 실측
    camera_mount:
      x_m: 0.636                     # 실측: 0.861 - 0.225
      y_m: 0.0                       # 중심선에 있다고 가정, 미실측
      z_m: 1.140                     # 실측
      pitch_deg: 0.0                 # 미실측
    gnss_mount:
      x_m: 0.559                     # 실측
      y_m: 0.0                       # 중심선에 있다고 가정, 미실측
      z_m: 1.424                     # 실측
    path_reference:
      offset_x_m: 0.0                # 설정값: 후륜축 중심
      offset_y_m: 0.0                # 설정값: 후륜축 중심
