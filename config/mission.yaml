/**:
  ros__parameters:
    # Mission Based Limit 구독·발행토픽 활성화 (false이면 입력/출력/timer 없음)
    mission_limit_enabled: false    # Motion Planning도 같은 key로 의존성 조절.
    # Mission 구간 정책 활성화
    # false = 등속 상한만 사용, true = 지도 task_sections + GlobalPose로 구간 판단.
    mission_sections_enabled: false # 파일 제공자도 동일 key로 mission_map 발행을 조절.

    # Motion Planning / Mission 공통 속도 상한. 변속 미적용 시 고정 목표, 내부 단위 m/s.
    # 2026-10-18 등속 테스트 요청값; 수정 가능. 실측 차량 한계와는 별개.
    cruise_speed_kph: 20.0

/control/motion_planning:
  ros__parameters:
    speed_profile:
      enabled: false                  # console --variable-speed로 실행별 적용.
      max_lateral_accel_mps2: 0.0      # 미확정. 변속 사용 시 양수 지정 필수.
      planned_decel_mps2: 0.0          # 미확정. 속도 계획에 사용할 가정 감속도, 양수 필수.
      curvature_sample_m: 1.0          # 지도 곡률 계산용 전후 거리.
      response_time_s: 0.5             # 미실측 지연 가정. 제동 성능 보장값 아님.
      max_path_distance_m: 3.0

/control/mission_based_limit:
  ros__parameters:
    # Mission 기본 제한: 구간 밖 / 구간 정책 비활성 시 공통 운용속도를 상한으로 사용.
    # 노드 활성화·구간 정책 활성화는 위 공통 영역에서 설정.
    mission_baseline_enabled: true
    traffic_light_applies: false    # 기존 신호 정책; 이번 GNSS-only 테스트에서는 사용하지 않음.
    object_timeout_s: 0.5           # 기존 ObjectState 경로의 freshness.
    state_timeout_s: 0.5            # 구간 판단에 사용하는 GlobalPose freshness.

    # Mission 구간 판단 불확실성 설정 (software policy / TUNE, 실차 보정값 아님)
    max_path_distance_m: 3.0        # 경로에서 이 거리보다 벗어나면 invalid/stop.
    association_tolerance_m: 1.0    # 가까운 다른 경로 후보도 고려할 거리 여유.
    position_sigma_multiplier: 2.0 # GNSS XY 분산으로 경계 판단 범위를 확장.
    # 경계에 걸치면 가능한 구간의 최소 속도 / 정지 OR 적용.
    # 분리된 경로 후보가 여러 개면 구간 불확실 -> invalid/stop.

    # Mission 구간별 정책: 시작·끝은 지도 task_sections에서 읽음 (수치 중복 기입 없음).
    section_ids: [straight_1]
    sections:
      straight_1:
        map_section: 직진1          # 현재 최종 지도에 존재하는 구간 이름.
        # max_speed_kph 생략 시 공통 운용속도 적용. 별도 감속이 필요하면 추가.
        margin_before_m: 0.0       # 구간 시작 전 속도 제한 적용 거리.
        margin_after_m: 0.0        # 구간 종료 후 속도 제한 유지 거리.
        stop_required: false       # true이면 원래 구간에서 정지 요구 (마진은 속도에만 적용).
